services:
  api:
    build: ./api
    container_name: bias-scraper-api
    restart: unless-stopped
    ports:
      - "3010:3001"
    environment:
      - DB_HOST=192.168.1.64
      - DB_PORT=5432
      - DB_NAME=bias_scraper
      - DB_USER=casaos
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      # Necesario para que la cookie de sesión salga con Secure — sin
      # esto el login no rompe, pero la cookie no se marcaría Secure
      # y quedaría mandándose también por HTTP en vez de solo HTTPS.
      - NODE_ENV=production

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: bias-scraper-web
    restart: unless-stopped
    ports:
      - "3011:80"
    depends_on:
      - api

  # El scraper corre como servicio persistente (server.py, Flask+gunicorn)
  # esperando peticiones en /run — en reposo no carga los modelos pesados
  # de NLP, solo lo hace el subproceso de pipeline.py cuando se dispara.
  # No se publica su puerto al host: solo debe ser alcanzable desde api/
  # por la red interna de Docker Compose, vía el nombre del servicio
  # "scraper" (ver api/routes/scraper.js).
  scraper:
    build: ./scraper
    container_name: bias-scraper-pipeline
    restart: unless-stopped
    environment:
      - DB_HOST=192.168.1.64
      - DB_PORT=5432
      - DB_NAME=bias_scraper
      - DB_USER=casaos
      - DB_PASSWORD=${DB_PASSWORD}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # Sin esto, el contenedor queda en UTC — 6h adelante de México
      # (sin horario de verano desde 2022) — y date.today() calcula
      # el día equivocado entre las 6pm y medianoche hora local.
      - TZ=America/Mexico_City
    volumes:
      - ./scraper:/app
